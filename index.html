<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeVault</title>
    <meta name="description" content="Biblioteca de módulos reutilizables (React, TypeScript, Tailwind, Motion) con documentación, demos e instalador por CLI." />
    <meta name="theme-color" content="#4f46e5" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="CodeVault" />
    <meta property="og:description" content="Módulos reutilizables con documentación, demos y un instalador por CLI. Copia lo que necesitas a tu proyecto." />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234f46e5'/%3E%3Cpath d='M8 22l6-10 4 6 2-3 4 7z' fill='white'/%3E%3C/svg%3E" />
    <script>
      // Evita el destello de tema incorrecto antes de que cargue React.
      // Debe coincidir con STORAGE_KEY en src/modules/ui/theme-toggle/theme-store.ts
      (() => {
        try {
          const m = localStorage.getItem("codevault-theme") || "system";
          const dark = m === "dark" || (m === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
